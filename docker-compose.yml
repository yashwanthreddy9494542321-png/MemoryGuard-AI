version: '3.8'

services:
  # Optional local Qdrant vector engine container
  qdrant:
    image: qdrant/qdrant:latest
    container_name: memoraguard_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./data/qdrant_docker_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped

  # Python FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: memoraguard_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
    env_file:
      - ./backend/.env
    depends_on:
      - qdrant
    restart: unless-stopped

  # React + Vite Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: memoraguard_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
